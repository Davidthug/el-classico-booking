<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Classico - Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>El Classico Beach</h1>

    <p>Admin Login</p>

</header>

<main>

    <section class="booking-box">

        <h2>Admin Login 🔐</h2>

        <form id="loginForm">

            <label for="email">Email</label>

            <input

                type="email"

                id="email"

                placeholder="Admin email"

                required

            >

            <label for="password">Password</label>

            <input

                type="password"

                id="password"

                placeholder="Password"

                required

            >

            <button type="submit">

                Login

            </button>

        </form>

        <div id="loginMessage"></div>

    </section>

</main>

<script src="login.js"></script>

</body>

</html>
