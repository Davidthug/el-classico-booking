<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Classico - Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

    * {

        box-sizing: border-box;

    }

    body {

        margin: 0;

        font-family: Arial, sans-serif;

        background: #f4f4f4;

        color: #222;

    }

    header {

        background: #111;

        color: white;

        text-align: center;

        padding: 25px 15px;

    }

    header h1 {

        margin: 0 0 8px;

        font-size: 32px;

    }

    header p {

        margin: 0;

        font-size: 16px;

    }

    .dashboard {

        width: 100%;

        max-width: 1100px;

        margin: auto;

        padding: 25px 20px;

    }

    .dashboard-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 20px;

    }

    .dashboard-header h2 {

        margin: 0;

        font-size: 28px;

    }

    .refresh-btn {

        width: auto;

        background: #111;

        color: white;

        border: none;

        padding: 12px 20px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 16px;

        margin: 0 0 20px;

    }

    .refresh-btn:hover {

        background: #333;

    }

    .booking-card {

        background: white;

        border-radius: 14px;

        padding: 22px;

        margin-bottom: 20px;

        box-shadow: 0 4px 15px rgba(0,0,0,0.12);

    }

    .booking-card h3 {

        margin: 0 0 15px;

        font-size: 21px;

    }

    .booking-card p {

        text-align: left;

        margin: 9px 0;

        line-height: 1.5;

    }

    .status {

        display: inline-block;

        padding: 7px 14px;

        border-radius: 20px;

        font-weight: bold;

        margin-top: 10px;

    }

    .pending {

        background: #fff3cd;

        color: #856404;

    }

    .confirmed {

        background: #d4edda;

        color: #155724;

    }

    .cancelled {

        background: #f8d7da;

        color: #721c24;

    }

    .actions {

        display: flex;

        gap: 12px;

        margin-top: 18px;

    }

    .actions button {

        flex: 1;

        margin: 0;

        padding: 12px;

        border: none;

        border-radius: 8px;

        color: white;

        font-size: 15px;

        cursor: pointer;

    }

    .confirm-btn {

        background: #198754;

    }

    .cancel-btn {

        background: #dc3545;

    }

    footer {

        text-align: center;

        padding: 25px 15px;

        margin-top: 20px;

    }

    /* 📱 MOBILE PHONE */

    @media (max-width: 600px) {

        header {

            padding: 20px 12px;

        }

        header h1 {

            font-size: 25px;

        }

        header p {

            font-size: 14px;

        }

        .dashboard {

            padding: 18px 12px;

        }

        .dashboard-header {

            display: block;

        }

        .dashboard-header h2 {

            font-size: 23px;

            margin-bottom: 15px;

        }

        .refresh-btn {

            width: 100%;

            font-size: 16px;

            padding: 13px;

        }

        .booking-card {

            padding: 17px;

            margin-bottom: 15px;

            border-radius: 12px;

        }

        .booking-card h3 {

            font-size: 19px;

        }

        .booking-card p {

            font-size: 14px;

            margin: 8px 0;

        }

        .actions {

            flex-direction: column;

            gap: 10px;

        }

        .actions button {

            width: 100%;

            padding: 13px;

            font-size: 16px;

        }

        footer {

            font-size: 14px;

        }

    }
    .stats-container {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 20px;

    margin: 25px 0;

}

.stat-card {

    background: white;

    padding: 25px;

    border-radius: 12px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.08);

}

.stat-card h3 {

    margin-bottom: 10px;

    font-size: 18px;

}

.stat-card p {

    font-size: 32px;

    font-weight: bold;

}

@media (max-width: 700px) {

    .stats-container {

        grid-template-columns: repeat(2, 1fr);

    }

}

@media (max-width: 450px) {

    .stats-container {

        grid-template-columns: 1fr;

    }

}

/* ===== EL CLASSICO BEACH - LUXURY ADMIN THEME ===== */

:root {

    --beach-navy: #123047;

    --beach-blue: #176b87;

    --beach-light: #eaf7fa;

    --beach-gold: #d4ad60;

    --beach-white: #ffffff;

    --beach-text: #243746;

    --beach-muted: #718096;

    --beach-border: #dce8ed;

}

body {

    background: linear-gradient(135deg, #edf8fa, #f8fbfc);

    color: var(--beach-text);

    font-family: "Segoe UI", Arial, sans-serif;

}

h1, h2, h3 {

    color: var(--beach-navy);

    letter-spacing: 0.3px;

}

.stats-container {

    gap: 20px;

    margin: 24px 0;

}

.stats-container > * {

    background: var(--beach-white);

    border: 1px solid var(--beach-border);

    border-top: 4px solid var(--beach-gold);

    border-radius: 16px;

    padding: 22px;

    box-shadow: 0 8px 24px rgba(18, 48, 71, 0.07);

    transition: transform 0.2s ease, box-shadow 0.2s ease;

}

.stats-container > *:hover {

    transform: translateY(-3px);

    box-shadow: 0 12px 28px rgba(18, 48, 71, 0.12);

}

button {

    border: none;

    border-radius: 8px;

    padding: 10px 16px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;

}

button:hover {

    filter: brightness(0.94);

    transform: translateY(-1px);

}

button:focus-visible {

    outline: 3px solid var(--beach-gold);

    outline-offset: 3px;

}

table {

    width: 100%;

    border-collapse: collapse;

    background: var(--beach-white);

    border-radius: 12px;

    overflow: hidden;

}

th {

    background: var(--beach-navy);

    color: var(--beach-white);

    padding: 14px;

    text-align: left;

}

td {

    padding: 13px 14px;

    border-bottom: 1px solid var(--beach-border);

}

tbody tr:hover {

    background: var(--beach-light);

}

input, select, textarea {

    max-width: 100%;

    border: 1px solid var(--beach-border);

    border-radius: 8px;

    padding: 10px 12px;

    font: inherit;

}

input:focus, select:focus, textarea:focus {

    outline: 2px solid var(--beach-blue);

    outline-offset: 1px;

}

@media (max-width: 700px) {

    .stats-container {

        gap: 12px;

    }

    .stats-container > * {

        padding: 15px;

    }

    table {

        font-size: 13px;

    }

    th, td {

        padding: 9px 7px;

    }

}

</style>

</head>

<body>

<header>

    <h1>El Classico Beach</h1>

    <p>Admin Booking Dashboard</p>

</header>

<main>

    <section class="dashboard">

        <div class="dashboard-header">

    <h2>Restaurant Bookings 📋</h2>

</div>

<button class="refresh-btn" onclick="loadBookings()">

    🔄 Refresh Bookings

</button>

<div class="stats-container">

    <div class="stat-card">

        <h3>Total Bookings</h3>

        <p id="totalBookings">0</p>

    </div>

    <div class="stat-card">

        <h3>Pending</h3>

        <p id="pendingBookings">0</p>

    </div>

    <div class="stat-card">

        <h3>Confirmed</h3>

        <p id="confirmedBookings">0</p>

    </div>

    <div class="stat-card">

        <h3>Cancelled</h3>

        <p id="cancelledBookings">0</p>

    </div>

</div>

<div id="bookingsList">

    <p>Loading bookings...</p>

</div>

    </section>

</main>

<footer>

    <p>© 2026 El Classico Beach - Chez West</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

    emailjs.init({

    publicKey: "uFiGmelSOYM30mEbt"

});

const SUPABASE_URL = "https://bggvlpsehntmrxkdrsie.supabase.co";

const SUPABASE_KEY = "sb_publishable_YQTwXehHVdNjOv-LsAjnUQ_T1UZEEDi";

async function loadBookings() {

    const bookingsList = document.getElementById("bookingsList");

    bookingsList.innerHTML = "<p>Loading bookings...</p>";

    const adminToken = localStorage.getItem("adminAccessToken");

    if (!adminToken) {

        window.location.href = "login.html";

        return;

    }

    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/bookings?select=*&order=id.desc`,

            {

                method: "GET",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization": `Bearer ${adminToken}`

                }

            }

        );

        const result = await response.json();

        if (!response.ok) {

            console.error("Supabase error:", result);

            bookingsList.innerHTML = `

                <p style="color:red;">

                    ❌ Could not load bookings.

                </p>

                <p style="font-size:14px;">

                    ${result.message || result.error_description || "Unknown error"}

                </p>

            `;

            return;

        }

        const bookings = result;
        const total = bookings.length;

const pending = bookings.filter(

    booking => (booking.status || "Pending").toLowerCase() === "pending"

).length;

const confirmed = bookings.filter(

    booking => (booking.status || "").toLowerCase() === "confirmed"

).length;

const cancelled = bookings.filter(

    booking => (booking.status || "").toLowerCase() === "cancelled"

).length;
76
document.getElementById("totalBookings").textContent = total;

document.getElementById("pendingBookings").textContent = pending;

document.getElementById("confirmedBookings").textContent = confirmed;

document.getElementById("cancelledBookings").textContent = cancelled;

        if (bookings.length === 0) {

            bookingsList.innerHTML = `

                <p>📭 No bookings found.</p>

            `;

            return;

        }

        bookingsList.innerHTML = "";

        bookings.forEach(booking => {

            const status = booking.status || "Pending";

            bookingsList.innerHTML += `

                <div class="booking-card">

                    <h3>Booking #${booking.id}</h3>

                    <p>

                        <strong>Name:</strong>

                        ${booking.name}

                    </p>

                    <p>

                        <strong>Phone:</strong>

                        ${booking.phone}

                    </p>

                    <p>

                        <strong>Date:</strong>

                        ${booking.date}

                    </p>

                    <p>

                        <strong>Time:</strong>

                        ${booking.time}

                    </p>

                    <p>

                        <strong>Guests:</strong>

                        ${booking.guests}

                    </p>

                    <p>

                        <strong>Special Request:</strong>

                        ${booking.message || "None"}

                    </p>

                    <span class="status ${status.toLowerCase()}">

                        ${status}

                    </span>

                    <div class="actions">

                        <button

                            class="confirm-btn"

                            onclick="updateStatus(${booking.id}, 'Confirmed')">

                            ✅ Confirm

                        </button>

                        <button

                            class="cancel-btn"

                            onclick="updateStatus(${booking.id}, 'Cancelled')">

                            ❌ Cancel

                        </button>

                        <button class="delete-btn" onclick="deleteBooking(${booking.id})">

    🗑️ Delete

</button>

                    </div>

                </div>

            `;

        });

    } catch (error) {

        console.error("Error:", error);

        bookingsList.innerHTML = `

            <p style="color:red;">

                ❌ Could not connect to Supabase.

            </p>

            <p>${error.message}</p>

        `;

    }

}

async function updateStatus(id, newStatus) {

    const adminToken = localStorage.getItem("adminAccessToken");

    if (!adminToken) {

        window.location.href = "login.html";

        return;

    }

    try {

        // STEP 1: Update booking status in Supabase

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}&select=*`,

            {

                method: "PATCH",

                headers: {

                    "Content-Type": "application/json",

                    "apikey": SUPABASE_KEY,

                    "Authorization": `Bearer ${adminToken}`,

                    "Prefer": "return=representation"

                },

                body: JSON.stringify({

                    status: newStatus

                })

            }

        );

        if (!response.ok) {

            throw new Error(await response.text());

        }

        const updatedBookings = await response.json();

        const booking = updatedBookings[0];

        if (!booking) {

            throw new Error("Booking not found.");

        }

   // STEP 2: Send email to the customer

if (booking.email) {

    try {

        await emailjs.send(

            "service_3ndpq3e",

            "template_ov6tkup",

            {

                to_email: booking.email,

                to_name: booking.name,

                booking_date: booking.date,

                booking_time: booking.time,

                booking_status: newStatus

            }

        );

        alert(

            `Booking ${newStatus.toLowerCase()} successfully! Customer email sent.`

        );

    } catch (emailError) {

        console.error("Email error:", emailError);

        alert(

            `Booking ${newStatus.toLowerCase()} successfully, but the email could not be sent.`

        );

    }

} else {

    alert(

        `Booking ${newStatus.toLowerCase()} successfully, but this booking has no email address.`

    );

}

loadBookings();

    } catch (error) {

        console.error("Update error:", error);

        alert("❌ Could not complete the booking update.");

    }

}

loadBookings();

async function deleteBooking(id) {

    const adminToken = localStorage.getItem("adminAccessToken");

    if (!adminToken) {

        window.location.href = "login.html";

        return;

    }

    const confirmed = confirm(

        "Are you sure you want to delete this booking?"

    );

    if (!confirmed) {

        return;

    }

    try {

        const response = await fetch(

            `${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,

            {

                method: "DELETE",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization": `Bearer ${adminToken}`

                }

            }

        );

        if (!response.ok) {

            throw new Error(await response.text());

        }

        alert("✅ Booking deleted successfully!");

        loadBookings();

    } catch (error) {

        console.error(error);

        alert("❌ Could not delete booking.");

    }

}

</script>

</body>

</html>
